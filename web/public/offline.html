<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#36454d" />
    <title>Evenly: offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; background: #36454d; font-family: 'Courier New', Courier, monospace; color: #2a2a2e; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 12px 24px; box-sizing: border-box; }
      .paper { width: 100%; max-width: 420px; background: #fbfbf6; padding: 18px 18px 24px; }
      .head { font-size: 10px; letter-spacing: 1.5px; color: #77777e; font-weight: bold; border-bottom: 1px dashed #cfcfc8; padding-bottom: 8px; }
      h1 { font-size: 26px; margin: 14px 0 8px; font-weight: normal; }
      p { margin: 0 0 14px; line-height: 1.45; }
      button { width: 100%; min-height: 48px; font: inherit; font-weight: bold; color: #fbfbf6; background: #2a2a2e; border: 0; border-bottom: 4px solid #0b0b0d; border-radius: 3px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="paper">
      <div class="head">EVENLY · NO SIGNAL</div>
      <h1>You're offline</h1>
      <p>Evenly needs the internet to read bills and to save your splits. Check your connection, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
